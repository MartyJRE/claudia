name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: tmux for the tmux tests
        run: sudo apt-get install -y tmux
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...

  # Publishes the total to the "badges" branch as a shields.io endpoint, which
  # the README badge reads. Each badge job has its own group (one pending job per group
  # survives); publish-badge.sh retries when the two push at once.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: badge-coverage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: tmux for the tmux tests
        run: sudo apt-get install -y tmux
      - name: test with coverage
        run: go test -coverprofile=cover.out ./...
      - name: publish badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          echo "Coverage: $pct%" >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/publish-badge.sh coverage.json coverage "$pct"

  # The notification helper's tests. Coverage counts NotifierCore, not the thin
  # executables that wire it to AppKit.
  swift:
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: swift build --package-path notifier
      - name: test with coverage
        id: coverage
        run: |
          notifier/coverage.sh | tee coverage.txt
          pct=$(tail -1 coverage.txt | awk '{ printf "%g", int($1 * 10 + 0.5) / 10 }')
          echo "Swift coverage: $pct%" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

  # Every green push to main is a release. Tagging and goreleaser share one job
  # because a tag pushed with GITHUB_TOKEN starts no other workflow.
  release:
    if: github.event_name == 'push'
    needs: [check, swift]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: tag
        id: tag
        run: |
          tag=$(.github/scripts/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "HEAD is already released" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: goreleaser/goreleaser-action@v7
        if: steps.tag.outputs.tag != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  swift-badge:
    if: github.event_name == 'push'
    needs: swift
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: badge-swift
    steps:
      - uses: actions/checkout@v7
      - name: publish badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-badge.sh swift-coverage.json "swift coverage" "${{ needs.swift.outputs.pct }}"
