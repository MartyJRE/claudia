name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tmux for the tmux tests
        run: sudo apt-get install -y tmux
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...

  # Publishes the total to the "badges" branch as a shields.io endpoint, which
  # the README badge reads. Jobs writing that branch share one concurrency group.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: badges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tmux for the tmux tests
        run: sudo apt-get install -y tmux
      - name: test with coverage
        run: go test -coverprofile=cover.out ./...
      - name: publish badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          echo "Coverage: $pct%" >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/publish-badge.sh coverage.json coverage "$pct"

  # The notification helper's tests. Coverage counts NotifierCore, not the thin
  # executables that wire it to AppKit.
  swift:
    runs-on: macos-latest
    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: swift build --package-path notifier
      - name: test with coverage
        id: coverage
        run: |
          notifier/coverage.sh | tee coverage.txt
          pct=$(tail -1 coverage.txt | awk '{ printf "%g", int($1 * 10 + 0.5) / 10 }')
          echo "Swift coverage: $pct%" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

  swift-badge:
    if: github.event_name == 'push'
    needs: swift
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: badges
    steps:
      - uses: actions/checkout@v4
      - name: publish badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-badge.sh swift-coverage.json "swift coverage" "${{ needs.swift.outputs.pct }}"
